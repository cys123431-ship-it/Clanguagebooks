name: Chapter 3 MSVC verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch3-msvc-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact Chapter 3 complete examples
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mdPath = "book/part1/chapter03-c-program-components.md"
          $md = Get-Content $mdPath -Raw -Encoding UTF8
          $targets = [ordered]@{
            "ready.c"      = "**예제 A —"
            "minutes.c"    = "**예제 B —"
            "split_time.c" = "**예제 C —"
            "formats.c"    = "**예제 D —"
            "read_number.c"= "**예제 E —"
            "study_time.c" = "**예제 F —"
          }
          New-Item -ItemType Directory -Force -Path ".msvc-ch3" | Out-Null
          foreach ($entry in $targets.GetEnumerator()) {
            $markerPos = $md.IndexOf($entry.Value)
            if ($markerPos -lt 0) { throw "Marker not found: $($entry.Value)" }
            $fencePos = $md.IndexOf('```c', $markerPos)
            if ($fencePos -lt 0) { throw "C fence not found after $($entry.Value)" }
            $start = $fencePos + 4
            if ($md.Substring($start,2) -eq "`r`n") { $start += 2 }
            elseif ($md.Substring($start,1) -eq "`n") { $start += 1 }
            $end = $md.IndexOf('```', $start)
            if ($end -lt 0) { throw "Closing fence not found after $($entry.Value)" }
            $code = $md.Substring($start, $end - $start)
            $code = $code.TrimEnd("`r", "`n") + "`n"
            $out = Join-Path ".msvc-ch3" $entry.Key
            [System.IO.File]::WriteAllText((Resolve-Path ".msvc-ch3").Path + "\\$($entry.Key)", $code, [System.Text.UTF8Encoding]::new($false))
            Write-Host "EXTRACTED|$($entry.Key)|sha256=$((Get-FileHash $out -Algorithm SHA256).Hash)|bytes=$((Get-Item $out).Length)"
          }

      - name: Verify with installed MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location ".msvc-ch3"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsJson = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json
          $vsList = $vsJson | ConvertFrom-Json
          if (-not $vsList -or $vsList.Count -lt 1) { throw "No Visual Studio/Build Tools installation with MSVC x86/x64 tools found" }
          $vs = $vsList[0]
          $vsInstall = $vs.installationPath
          $vsName = $vs.displayName
          $vsProductVersion = $vs.catalog.productDisplayVersion
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd.bat not found at $vsDevCmd" }

          cmd /c "call `"$vsDevCmd`" -arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], "Process")
            }
          }
          $clPath = (Get-Command cl.exe -ErrorAction Stop).Source
          $clBanner = (& cl 2>&1 | Out-String).Trim()
          Write-Host "ENVIRONMENT|VisualStudio=$vsName|productVersion=$vsProductVersion|cl=$clPath"
          Write-Host "CL_BANNER_BEGIN"
          Write-Host $clBanner
          Write-Host "CL_BANNER_END"

          function Invoke-Build {
            param([string]$Tag, [string]$File, [string[]]$Extra = @())
            $args = @("/std:c17", "/W4") + $Extra + @($File)
            Write-Host "COMMAND|$Tag|cl $($args -join ' ')"
            $lines = & cl @args 2>&1
            $exit = $LASTEXITCODE
            $text = ($lines | ForEach-Object { "$_" }) -join "`n"
            if ($text.Length -gt 0) { Write-Host $text }
            $warningCount = ([regex]::Matches($text, '(?im)\bwarning\s+C\d+\b')).Count
            $errorCount = ([regex]::Matches($text, '(?im)\b(?:fatal\s+)?error\s+(?:C|LNK)\d+\b')).Count
            $c4996 = [bool]($text -match '\bC4996\b')
            Write-Host "BUILD_RESULT|$Tag|exit=$exit|warnings=$warningCount|errors=$errorCount|C4996=$c4996"
            [pscustomobject]@{ Tag=$Tag; Exit=$exit; Warnings=$warningCount; Errors=$errorCount; C4996=$c4996; Text=$text }
          }

          function Invoke-Run {
            param([string]$Tag, [string]$Exe, [AllowNull()][string]$InputText, [bool]$ImmediateEof=$false)
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path $Exe).Path
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            if (-not $ImmediateEof -and $null -ne $InputText) {
              $p.StandardInput.WriteLine($InputText)
            }
            $p.StandardInput.Close()
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            $normOut = $stdout -replace "`r`n", "`n"
            $normErr = $stderr -replace "`r`n", "`n"
            $escapedOut = $normOut.Replace("`n","<LF>")
            $escapedErr = $normErr.Replace("`n","<LF>")
            Write-Host "RUN_RESULT|$Tag|exit=$($p.ExitCode)|stdout=$escapedOut|stderr=$escapedErr"
            [pscustomobject]@{ Tag=$Tag; Exit=$p.ExitCode; Out=$normOut; Err=$normErr }
          }

          function Assert-Run {
            param($Run, [int]$ExpectedExit, [string]$ExpectedOut)
            if ($Run.Exit -ne $ExpectedExit) { throw "$($Run.Tag): expected exit $ExpectedExit, got $($Run.Exit)" }
            if ($Run.Out -ne $ExpectedOut) { throw "$($Run.Tag): stdout mismatch. Expected=[$ExpectedOut] Actual=[$($Run.Out)]" }
            if ($Run.Err -ne "") { throw "$($Run.Tag): unexpected stderr [$($Run.Err)]" }
          }

          $failed = $false

          foreach ($spec in @(
            @{Tag="A_ready"; File="ready.c"; Exe=".\ready.exe"; Out="Study log ready.`n"},
            @{Tag="B_minutes"; File="minutes.c"; Exe=".\minutes.exe"; Out="Study: 35 min`n"},
            @{Tag="C_split_time"; File="split_time.c"; Exe=".\split_time.exe"; Out="2 h 15 min`n"},
            @{Tag="D_formats"; File="formats.c"; Exe=".\formats.exe"; Out="Sessions: 3`nHours: 1.500000`nGroup: B`nTopic: Review`n"}
          )) {
            $b = Invoke-Build -Tag $spec.Tag -File $spec.File
            if ($b.Exit -ne 0 -or $b.Warnings -ne 0 -or $b.Errors -ne 0) { $failed = $true }
            if ($b.Exit -eq 0) {
              $r = Invoke-Run -Tag "$($spec.Tag)_run" -Exe $spec.Exe -InputText $null -ImmediateEof $true
              try { Assert-Run $r 0 $spec.Out } catch { Write-Host "ASSERT_FAIL|$($_.Exception.Message)"; $failed = $true }
            }
          }

          $eBase = Invoke-Build -Tag "E_read_number_baseline" -File "read_number.c"
          $eNeedAdjust = $eBase.C4996
          if ($eBase.Exit -ne 0 -and -not $eNeedAdjust) { $failed = $true }
          if ($eNeedAdjust) {
            $eAdj = Invoke-Build -Tag "E_read_number_adjusted" -File "read_number.c" -Extra @("/D_CRT_SECURE_NO_WARNINGS")
            if ($eAdj.Exit -ne 0 -or $eAdj.Warnings -ne 0 -or $eAdj.Errors -ne 0) { $failed = $true }
          } else {
            Write-Host "ADJUSTED_NOT_REQUIRED|E_read_number|baseline_C4996=false"
          }

          $fBase = Invoke-Build -Tag "F_study_time_baseline" -File "study_time.c"
          $fNeedAdjust = $fBase.C4996
          if ($fBase.Exit -ne 0 -and -not $fNeedAdjust) { $failed = $true }
          if ($fNeedAdjust) {
            $fAdj = Invoke-Build -Tag "F_study_time_adjusted" -File "study_time.c" -Extra @("/D_CRT_SECURE_NO_WARNINGS")
            if ($fAdj.Exit -ne 0 -or $fAdj.Warnings -ne 0 -or $fAdj.Errors -ne 0) { $failed = $true }
          } else {
            Write-Host "ADJUSTED_NOT_REQUIRED|F_study_time|baseline_C4996=false"
          }

          if (Test-Path ".\read_number.exe") {
            foreach ($case in @(
              @{Tag="E_42"; Input="42"; Eof=$false; Exit=0; Out="Enter an integer:`nRead: 42`n"},
              @{Tag="E_0"; Input="0"; Eof=$false; Exit=0; Out="Enter an integer:`nRead: 0`n"},
              @{Tag="E_abc"; Input="abc"; Eof=$false; Exit=1; Out="Enter an integer:`nInput failed.`n"},
              @{Tag="E_EOF"; Input=$null; Eof=$true; Exit=1; Out="Enter an integer:`nInput failed.`n"}
            )) {
              $r = Invoke-Run -Tag $case.Tag -Exe ".\read_number.exe" -InputText $case.Input -ImmediateEof $case.Eof
              try { Assert-Run $r $case.Exit $case.Out } catch { Write-Host "ASSERT_FAIL|$($_.Exception.Message)"; $failed = $true }
            }
          } else { Write-Host "ASSERT_FAIL|read_number.exe missing"; $failed = $true }

          if (Test-Path ".\study_time.exe") {
            foreach ($case in @(
              @{Tag="F_135"; Input="135"; Eof=$false; Exit=0; Out="Study minutes (0-1440):`nStudy: 2 h 15 min`n"},
              @{Tag="F_60"; Input="60"; Eof=$false; Exit=0; Out="Study minutes (0-1440):`nStudy: 1 h 0 min`n"},
              @{Tag="F_0"; Input="0"; Eof=$false; Exit=0; Out="Study minutes (0-1440):`nStudy: 0 h 0 min`n"},
              @{Tag="F_1440"; Input="1440"; Eof=$false; Exit=0; Out="Study minutes (0-1440):`nStudy: 24 h 0 min`n"},
              @{Tag="F_abc"; Input="abc"; Eof=$false; Exit=1; Out="Study minutes (0-1440):`nInput failed.`n"},
              @{Tag="F_EOF"; Input=$null; Eof=$true; Exit=1; Out="Study minutes (0-1440):`nInput failed.`n"}
            )) {
              $r = Invoke-Run -Tag $case.Tag -Exe ".\study_time.exe" -InputText $case.Input -ImmediateEof $case.Eof
              try { Assert-Run $r $case.Exit $case.Out } catch { Write-Host "ASSERT_FAIL|$($_.Exception.Message)"; $failed = $true }
            }
          } else { Write-Host "ASSERT_FAIL|study_time.exe missing"; $failed = $true }

          Write-Host "SUMMARY|failed=$failed|E_C4996=$($eBase.C4996)|F_C4996=$($fBase.C4996)"
          if ($failed) { exit 1 }
