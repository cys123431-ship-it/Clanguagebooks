name: Chapter 3 solutions MSVC verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch3-solutions-msvc-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract exact solution programs and verify with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $mdPath = "book/solutions/part1/chapter03-solutions.md"
          $md = [System.IO.File]::ReadAllText((Resolve-Path $mdPath).Path)
          $work = Join-Path $env:RUNNER_TEMP "ch3-solutions-msvc"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $targets = @(
            @{ Problem=11; File="printing_ticket.c"; Hash="5b009f763a4bdb9fd7a87512c5e8840c14c02ea1b23368bcfcf16373fd124e01" },
            @{ Problem=12; File="two_study_records.c"; Hash="9428c0946cd6b2d69ab4cb70e1fc0f390e148d859c94465c6a32dd6c7f1fb672" }
          )
          $extractions = @()
          foreach ($target in $targets) {
            $section = [regex]::Match($md, "(?ms)^## 문제 $($target.Problem)\..*?(?=^## 문제 |\z)")
            if (-not $section.Success) { throw "Problem section missing: $($target.Problem)" }
            $listing = [regex]::Match($section.Value, '(?ms)^```c\r?\n(?<code>.*?)^```')
            if (-not $listing.Success) { throw "Complete C listing missing" }
            $path = Join-Path $work $target.File
            [System.IO.File]::WriteAllText($path, $listing.Groups["code"].Value, [System.Text.UTF8Encoding]::new($false))
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $target.Hash) { throw "Exact source hash mismatch: $($target.File)" }
            $extractions += @{ File=$target.File; SHA256=$hash; Bytes=(Get-Item $path).Length }
            Write-Host "EXTRACTED|$($target.File)|sha256=$hash|bytes=$((Get-Item $path).Length)"
          }

          $os = Get-CimInstance Win32_OperatingSystem
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "STOP: vswhere unavailable" }
          $vsList = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $vsList) { throw "STOP: MSVC installation unavailable" }
          $vs = @($vsList)[0]
          $vsDevCmd = Join-Path $vs.installationPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "call `"$vsDevCmd`" -arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], "Process")
            }
          }
          $clPath = (Get-Command cl.exe -ErrorAction Stop).Source
          $banner = (& cl 2>&1 | Out-String).Trim()
          $environment = @{
            Windows=$os.Caption; WindowsVersion=$os.Version; WindowsBuild=$os.BuildNumber;
            ImageOS=$env:ImageOS; ImageVersion=$env:ImageVersion;
            VisualStudio=$vs.displayName; ProductVersion=$vs.catalog.productDisplayVersion;
            InstallationVersion=$vs.installationVersion; ClPath=$clPath; ClBanner=$banner;
            SourceCommit=$env:GITHUB_SHA
          }
          Write-Host "ENVIRONMENT_JSON|$($environment | ConvertTo-Json -Compress)"
          Set-Location $work

          function Invoke-Build {
            param([string]$File, [string]$Kind, [string[]]$Extra=@())
            $exe = [System.IO.Path]::ChangeExtension($File, ".exe")
            $obj = [System.IO.Path]::ChangeExtension($File, ".obj")
            Remove-Item $exe,$obj -Force -ErrorAction SilentlyContinue
            $options = @("/std:c17", "/W4") + $Extra + @($File)
            Write-Host "COMMAND|$Kind|cl $($options -join ' ')"
            $diagnostics = & cl @options 2>&1
            $buildExit = $LASTEXITCODE
            $text = ($diagnostics | ForEach-Object { "$_" }) -join "`n"
            Write-Host $text
            $warnings = [regex]::Matches($text, '(?im)\bwarning\s+C\d+\b').Count
            $errors = [regex]::Matches($text, '(?im)\b(?:fatal\s+)?error\s+(?:C|LNK)\d+\b').Count
            $result = @{
              File=$File; Kind=$Kind; Command="cl $($options -join ' ')";
              Exit=$buildExit; Warnings=$warnings; Errors=$errors;
              C4996=[bool]($text -match '\bC4996\b'); ExecutableProduced=(Test-Path $exe);
              Diagnostics=$text
            }
            Write-Host "BUILD_RESULT_JSON|$($result | ConvertTo-Json -Compress)"
            return $result
          }

          function Invoke-Run {
            param([string]$Exe, [string]$Tag, [AllowNull()][string]$InputText, [int]$ExpectedExit, [string]$ExpectedOut)
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path $Exe).Path
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if ($null -ne $InputText) { $p.StandardInput.Write($InputText) }
            $p.StandardInput.Close()
            if (-not $p.WaitForExit(10000)) { $p.Kill($true); throw "Runtime timeout: $Tag" }
            $stdout = $outTask.GetAwaiter().GetResult() -replace "`r`n", "`n"
            $stderr = $errTask.GetAwaiter().GetResult() -replace "`r`n", "`n"
            $result = @{
              Tag=$Tag; Input=$InputText; Stdout=$stdout; Stderr=$stderr; Exit=$p.ExitCode;
              ExpectedStdout=$ExpectedOut; ExpectedExit=$ExpectedExit;
              Passed=($stdout -ceq $ExpectedOut -and $stderr -eq "" -and $p.ExitCode -eq $ExpectedExit)
            }
            Write-Host "RUN_RESULT_JSON|$($result | ConvertTo-Json -Compress)"
            if (-not $result.Passed) { throw "Runtime assertion failed: $Tag" }
            $p.Dispose()
            return $result
          }

          $builds = @()
          foreach ($target in $targets) {
            $builds += Invoke-Build -File $target.File -Kind "baseline"
            $adjusted = Invoke-Build -File $target.File -Kind "adjusted" -Extra @("/D_CRT_SECURE_NO_WARNINGS")
            $builds += $adjusted
            if ($adjusted.Exit -ne 0 -or $adjusted.Warnings -ne 0 -or $adjusted.Errors -ne 0 -or -not $adjusted.ExecutableProduced) {
              throw "Adjusted build failed or has diagnostics: $($target.File)"
            }
          }

          $runs = @()
          foreach ($case in @(
            @{Tag="P11_0"; Input="0`n"; Exit=0; Out="Sheets (0-20):`nTotal: 0 won`n"},
            @{Tag="P11_4"; Input="4`n"; Exit=0; Out="Sheets (0-20):`nTotal: 600 won`n"},
            @{Tag="P11_20"; Input="20`n"; Exit=0; Out="Sheets (0-20):`nTotal: 3000 won`n"},
            @{Tag="P11_abc"; Input="abc`n"; Exit=1; Out="Sheets (0-20):`nInput failed.`n"},
            @{Tag="P11_EOF"; Input=$null; Exit=1; Out="Sheets (0-20):`nInput failed.`n"}
          )) {
            $runs += Invoke-Run -Exe ".\printing_ticket.exe" -Tag $case.Tag -InputText $case.Input -ExpectedExit $case.Exit -ExpectedOut $case.Out
          }
          foreach ($case in @(
            @{Tag="P12_120_90"; Input="120`n90`n"; Exit=0; Out="Morning minutes:`nAfternoon minutes:`nTotal: 3 h 30 min`n"},
            @{Tag="P12_0_0"; Input="0`n0`n"; Exit=0; Out="Morning minutes:`nAfternoon minutes:`nTotal: 0 h 0 min`n"},
            @{Tag="P12_600_600"; Input="600`n600`n"; Exit=0; Out="Morning minutes:`nAfternoon minutes:`nTotal: 20 h 0 min`n"},
            @{Tag="P12_invalid_first"; Input="abc`n90`n"; Exit=1; Out="Morning minutes:`nInput failed.`n"},
            @{Tag="P12_invalid_second"; Input="120`nabc`n"; Exit=1; Out="Morning minutes:`nAfternoon minutes:`nInput failed.`n"},
            @{Tag="P12_EOF_first"; Input=$null; Exit=1; Out="Morning minutes:`nInput failed.`n"},
            @{Tag="P12_EOF_second"; Input="120`n"; Exit=1; Out="Morning minutes:`nAfternoon minutes:`nInput failed.`n"}
          )) {
            $runs += Invoke-Run -Exe ".\two_study_records.exe" -Tag $case.Tag -InputText $case.Input -ExpectedExit $case.Exit -ExpectedOut $case.Out
          }
          foreach ($target in $targets) {
            if ((Get-FileHash $target.File -Algorithm SHA256).Hash.ToLowerInvariant() -ne $target.Hash) {
              throw "Canonical source changed during verification"
            }
          }
          $report = @{ Environment=$environment; Extractions=$extractions; Builds=$builds; Runs=$runs; Passed=$true }
          Write-Host "FINAL_RESULT_JSON|$($report | ConvertTo-Json -Depth 8 -Compress)"
          Write-Host "SUMMARY|MSVC=PASS|builds=4|runtime_checks=12|exact_source_hashes=PASS"
          exit 0
