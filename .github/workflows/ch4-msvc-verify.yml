name: Temporary Chapter 4 MSVC verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ch4-msvc-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Prepare exact chapter listings
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ch4-check'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | Set-Content -Encoding utf8 (Join-Path $folder 'vs.json')
          [IO.File]::WriteAllBytes((Join-Path $folder 'verify.py'), [Convert]::FromBase64String(''))
      - name: MSVC C17 W4 builds and executions
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          python "%RUNNER_TEMP%\ch4-check\verify.py"
