name: Temporary Chapter 4 solution MSVC verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch4-solutions-msvc-temp.yml"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare exact solution programs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "tmp-ch4-solutions" | Out-Null
          [IO.File]::WriteAllBytes("tmp-ch4-solutions/problem8_limits.c",[Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("tmp-ch4-solutions/problem14_storage_record.c",[Convert]::FromBase64String(""))
          Get-FileHash tmp-ch4-solutions/*.c -Algorithm SHA256 | Format-Table -AutoSize

      - name: Verify with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere not found" }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json)[0]
          if ($null -eq $vs) { throw "No Visual Studio installation with MSVC found" }
          $devcmd = Join-Path $vs.installationPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "call `"$devcmd`" -arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1],$Matches[2],"Process") }
          }
          Write-Host "VISUAL_STUDIO=$($vs.displayName)"
          Write-Host "PRODUCT_VERSION=$($vs.catalog.productDisplayVersion)"
          Write-Host "INSTALLATION_VERSION=$($vs.installationVersion)"
          $cl = (Get-Command cl.exe -ErrorAction Stop).Source
          Write-Host "CL_PATH=$cl"
          Write-Host "CL_BANNER_BEGIN"
          (& cl 2>&1 | Out-String).Trim() | Write-Host
          Write-Host "CL_BANNER_END"

          Set-Location tmp-ch4-solutions
          function Test-One([string]$src,[string]$exe,[string]$expected) {
            Remove-Item $exe -ErrorAction SilentlyContinue
            Remove-Item ([IO.Path]::ChangeExtension($src,"obj")) -ErrorAction SilentlyContinue
            Write-Host "COMMAND=cl /std:c17 /W4 $src"
            $build = & cl /std:c17 /W4 $src 2>&1
            $buildExit=$LASTEXITCODE
            $buildText=($build | ForEach-Object {"$_"}) -join "`n"
            if($buildText){Write-Host $buildText}
            $warnings=([regex]::Matches($buildText,'(?im)\bwarning\s+C\d+\b')).Count
            $errors=([regex]::Matches($buildText,'(?im)\b(?:fatal\s+)?error\s+(?:C|LNK)\d+\b')).Count
            Write-Host "BUILD_RESULT|$src|exit=$buildExit|warnings=$warnings|errors=$errors"
            if($buildExit -ne 0 -or $warnings -ne 0 -or $errors -ne 0){throw "Build failed or not warnings-clean: $src"}
            $p = Start-Process -FilePath ".\$exe" -NoNewWindow -PassThru -RedirectStandardOutput "$exe.out" -RedirectStandardError "$exe.err" -Wait
            $stdout=[IO.File]::ReadAllText("$exe.out") -replace "`r`n","`n"
            $stderr=[IO.File]::ReadAllText("$exe.err") -replace "`r`n","`n"
            Write-Host "RUN_RESULT|$src|exit=$($p.ExitCode)|stdout=$($stdout.Replace("`n","<LF>"))|stderr=$($stderr.Replace("`n","<LF>"))"
            if($p.ExitCode -ne 0){throw "Runtime exit mismatch for $src"}
            if($stderr -ne ""){throw "Unexpected stderr for $src"}
            if($stdout -ne $expected){throw "stdout mismatch for $src"}
          }
          Test-One "problem8_limits.c" "problem8_limits.exe" "INT_MIN: -2147483648`nINT_MAX: 2147483647`nLONG_MIN: -2147483648`nLONG_MAX: 2147483647`nUINT_MAX: 4294967295`n"
          Test-One "problem14_storage_record.c" "problem14_storage_record.exe" "Samples: 24`nZone: M`nTotal mass: 1.5000 kg`nTotal mass size: 8 bytes`nINT_MAX: 2147483647`n"
